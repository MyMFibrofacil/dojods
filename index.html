<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario de Datos – Dojo DS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: #0b1220;
      color: #e6edf7;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 24px;
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
    }

    h2 {
      margin-top: 28px;
      font-size: 16px;
      color: #cfe0ff;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: #e6edf7;
    }

    input::placeholder {
      opacity: 0.6;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      margin-top: 28px;
      padding: 14px;
      width: 100%;
      border-radius: 14px;
      border: none;
      background: #2fe87a;
      color: #04140a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .note {
      margin-top: 16px;
      font-size: 12px;
      opacity: 0.7;
      text-align: center;
    }

    @media (max-width: 760px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <h1>Formulario de Alta de Datos</h1>

      <!-- ⚠️ PEGÁ ACÁ TU URL DE APPS SCRIPT QUE TERMINE EN /exec -->
      <form
        action="https://script.google.com/macros/s/PEGAR_ID_REAL_AQUI/exec"
        method="POST"
      >

        <h2>Datos personales</h2>
        <div class="grid-2">
          <div>
            <label>Nombre *</label>
            <input name="nombre" required>
          </div>
          <div>
            <label>Apellido *</label>
            <input name="apellido" required>
          </div>

          <div>
            <label>DNI *</label>
            <input name="dni" required>
          </div>
          <div>
            <label>Fecha de nacimiento *</label>
            <input type="date" name="fecha_nacimiento" required>
          </div>

          <div>
            <label>Celular *</label>
            <input name="celular" required>
          </div>
          <div>
            <label>Mail *</label>
            <input type="email" name="mail" required>
          </div>

          <div class="full">
            <label>Dirección *</label>
            <input name="direccion" required>
          </div>

          <div class="full">
            <label>Localidad *</label>
            <input name="localidad" required>
          </div>
        </div>

        <h2>Contacto de emergencia 1</h2>
        <div class="grid-3">
          <div>
            <label>Nombre y apellido *</label>
            <input name="em1_nombre" required>
          </div>
          <div>
            <label>Celular *</label>
            <input name="em1_celular" required>
          </div>
          <div>
            <label>Relación *</label>
            <input name="em1_relacion" required>
          </div>
        </div>

        <h2>Contacto de emergencia 2</h2>
        <div class="grid-3">
          <div>
            <label>Nombre y apellido *</label>
            <input name="em2_nombre" required>
          </div>
          <div>
            <label>Celular *</label>
            <input name="em2_celular" required>
          </div>
          <div>
            <label>Relación *</label>
            <input name="em2_relacion" required>
          </div>
        </div>

        <button type="submit">Enviar</button>

        <div class="note">
          Al enviar el formulario, los datos se registran y se notifica por email.
        </div>

      </form>
    </div>
  </div>
</body>
</html>
