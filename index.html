<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario de Datos – Dojo DS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0b1220; color:#e6edf7; }
    .container { max-width: 900px; margin: 0 auto; padding: 24px; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 24px; }
    h1 { margin: 0 0 14px; font-size: 22px; }
    h2 { margin: 26px 0 10px; font-size: 16px; color:#cfe0ff; }

    .grid-2 { display:grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .grid-3 { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

    label { display:block; font-size: 12px; margin-bottom: 6px; opacity: 0.85; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25); color:#e6edf7;
    }
    input::placeholder { opacity: 0.6; }
    .full { grid-column: 1 / -1; }

    button {
      margin-top: 26px; padding: 14px; width: 100%;
      border-radius: 14px; border: none;
      background:#2fe87a; color:#04140a;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .note { margin-top: 14px; font-size: 12px; opacity: 0.7; text-align:center; }

    @media (max-width: 760px){
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Formulario de Alta de Datos</h1>

      <form
        action="https://script.google.com/macros/s/AKfycbyuMY2YZRsDm1SqnRe497KMwAIRFOJxpsoexVq76tMpCMFRw7t6kzUMwzQIKZkzt1KJxw/exec"
        method="POST"
      >
        <h2>Datos personales</h2>
        <div class="grid-2">
          <div>
            <label>Nombre *</label>
            <input name="nombre" required maxlength="60" placeholder="Juan">
          </div>
          <div>
            <label>Apellido *</label>
            <input name="apellido" required maxlength="60" placeholder="Pérez">
          </div>

          <div>
            <label>DNI *</label>
            <input name="dni" required maxlength="20" placeholder="12345678">
          </div>
          <div>
            <label>Fecha de nacimiento *</label>
            <input type="date" name="fecha_nacimiento" required>
          </div>

          <div>
            <label>Celular *</label>
            <input name="celular" required maxlength="30" placeholder="+54 11 ...">
          </div>
          <div>
            <label>Mail *</label>
            <input type="email" name="mail" required maxlength="120" placeholder="correo@ejemplo.com">
          </div>

          <div class="full">
            <label>Dirección *</label>
            <input name="direccion" required maxlength="120" placeholder="Calle 123, Piso, Depto">
          </div>

          <div class="full">
            <label>Localidad *</label>
            <input name="localidad" required maxlength="80" placeholder="San Fernando">
          </div>
        </div>

        <h2>Contacto de emergencia 1</h2>
        <div class="grid-3">
          <div>
            <label>Nombre y apellido *</label>
            <input name="em1_nombre" required maxlength="120" placeholder="María Pérez">
          </div>
          <div>
            <label>Celular *</label>
            <input name="em1_celular" required maxlength="30" placeholder="+54 11 ...">
          </div>
          <div>
            <label>Relación *</label>
            <input name="em1_relacion" required maxlength="50" placeholder="Madre / Padre / Pareja">
          </div>
        </div>

        <h2>Contacto de emergencia 2</h2>
        <div class="grid-3">
          <div>
            <label>Nombre y apellido *</label>
            <input name="em2_nombre" required maxlength="120" placeholder="Carlos Gómez">
          </div>
          <div>
            <label>Celular *</label>
            <input name="em2_celular" required maxlength="30" placeholder="+54 11 ...">
          </div>
          <div>
            <label>Relación *</label>
            <input name="em2_relacion" required maxlength="50" placeholder="Hermano / Amigo">
          </div>
        </div>

        <button type="submit">Enviar</button>

        <div class="note">
          Al enviar, los datos se registran y se notifica por email.
        </div>
      </form>
    </div>
  </div>
</body>
</html>
